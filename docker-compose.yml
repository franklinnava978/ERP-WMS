services:
  db:
    image: postgres:15-alpine
    container_name: wms_postgres
    restart: always
    environment:
      POSTGRES_USER: wms_user
      POSTGRES_PASSWORD: wms_password
      POSTGRES_DB: wms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_user -d wms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: wms_api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PROJECT_NAME=ERP-WMS
      - ENV=development
      - DATABASE_URL=postgresql+asyncpg://wms_user:wms_password@db:5432/wms_db
      - SECRET_KEY=una_clave_secreta_super_segura_para_jwt_cambiar_en_produccion
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    volumes:
      - ./src:/app/src  # Mapeamos el código local al contenedor para ver cambios en tiempo real (--reload)

volumes:
  postgres_data: